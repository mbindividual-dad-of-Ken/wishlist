<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>商品收藏</title>
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="商品收藏" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0f0f0f;
      --bg2:     #181818;
      --bg3:     #222;
      --bg4:     #2a2a2a;
      --border:  #2e2e2e;
      --border2: #3a3a3a;
      --text:    #f0ede8;
      --text2:   #a09d98;
      --text3:   #6b6866;
      --accent:  #e8b86d;
      --accent2: #c8942d;
      --danger:  #e05c5c;
      --success: #5ca87a;
      --info:    #5b9bd5;
      --r:       10px;
      --rl:      16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
    #app { max-width: 480px; margin: 0 auto; padding-bottom: 80px; }

    .topbar { position: sticky; top: 0; z-index: 50; background: var(--bg); border-bottom: 1px solid var(--border); padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { font-size: 17px; font-weight: 700; }
    .topbar-title em { color: var(--accent); font-style: normal; }
    .sync-pill { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); background: var(--bg2); border: 1px solid var(--border); border-radius: 100px; padding: 4px 10px; cursor: pointer; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
    .dot.ok   { background: var(--success); }
    .dot.busy { background: var(--accent); animation: blink .7s infinite alternate; }
    .dot.err  { background: var(--danger); }
    @keyframes blink { from{opacity:.3}to{opacity:1} }

    .stats { padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; }
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
    .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 7px 6px; text-align: center; }
    .stat-v { font-size: 16px; font-weight: 700; }
    .stat-v.c-need { color: #e05c5c; }
    .stat-v.c-love { color: #e8b86d; }
    .stat-v.c-like { color: #5b9bd5; }
    .stat-v.c-want { color: #6b6866; }
    .stat-v.c-got  { color: #5ca87a; }
    .stat-l { font-size: 10px; color: var(--text3); margin-top: 1px; }
    .budget-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stats-hint { font-size: 10px; color: var(--text3); text-align: center; padding-top: 2px; }
    .edit-bar { margin: 0 16px 10px; padding: 9px 12px; background: rgba(232,184,109,.1); border: 1px solid rgba(232,184,109,.3); border-radius: var(--r); display: none; align-items: center; justify-content: space-between; font-size: 12px; color: var(--accent); }
    .edit-bar.show { display: flex; }
    .edit-bar button { background: none; border: none; color: var(--text2); font-size: 12px; cursor: pointer; font-family: inherit; text-decoration: underline; }
    .budget-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
    .budget-label { font-size: 11px; color: var(--text3); }
    .budget-val { font-size: 15px; font-weight: 700; color: var(--accent); }
    .budget-val.spent { color: var(--success); }

    .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg); border-top: 1px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 50; }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 10px 0; background: none; border: none; cursor: pointer; font-size: 10px; color: var(--text3); font-family: inherit; transition: color .15s; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .page { display: none; }
    .page.active { display: block; }

    .url-section { padding: 14px 16px 0; }
    .url-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 12px 14px; }
    .url-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .url-row { display: flex; gap: 8px; }
    .url-row input { flex: 1; background: var(--bg3); color: var(--text); border: 1px solid var(--border2); border-radius: var(--r); padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; transition: border-color .15s; }
    .url-row input:focus { border-color: var(--accent); }
    .url-row input::placeholder { color: var(--text3); }
    .fetch-btn { display: flex; align-items: center; gap: 5px; padding: 10px 14px; background: var(--accent); color: #0f0f0f; border: none; border-radius: var(--r); font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; white-space: nowrap; transition: all .15s; flex-shrink: 0; }
    .fetch-btn:hover { background: var(--accent2); }
    .fetch-btn:disabled { opacity: .45; cursor: not-allowed; }

    .fetch-status { margin-top: 10px; border-radius: var(--r); padding: 9px 12px; font-size: 13px; display: none; align-items: center; gap: 8px; }
    .fetch-status.loading { display: flex; background: var(--bg3); color: var(--text2); }
    .fetch-status.success { display: flex; background: rgba(92,168,122,.12); color: var(--success); border: 1px solid rgba(92,168,122,.25); }
    .fetch-status.fail    { display: flex; background: rgba(224,92,92,.1); color: var(--danger); border: 1px solid rgba(224,92,92,.2); }
    .sp-sm { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.15); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .preview-card { margin-top: 10px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--r); padding: 10px; display: none; align-items: flex-start; gap: 10px; }
    .preview-card.show { display: flex; }
    .preview-thumb { width: 58px; height: 58px; border-radius: 8px; object-fit: cover; background: var(--bg4); flex-shrink: 0; }
    .preview-name  { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .preview-price { font-size: 13px; color: var(--accent); font-weight: 700; }
    .preview-shop  { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .preview-hint  { font-size: 11px; color: var(--text3); margin-top: 5px; }

    .form-section { padding: 12px 16px 0; }
    .form-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 14px; margin-bottom: 10px; }
    .form-card-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .form-card-title svg { width: 13px; height: 13px; stroke: var(--text3); fill: none; stroke-width: 1.8; }
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }
    .field-label { font-size: 11px; color: var(--text3); margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
    .auto-badge { font-size: 10px; padding: 1px 6px; background: rgba(92,168,122,.15); color: var(--success); border-radius: 100px; border: 1px solid rgba(92,168,122,.3); }
    input, select, textarea { width: 100%; background: var(--bg3); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; font-size: 14px; font-family: inherit; outline: none; appearance: none; transition: border-color .15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: var(--text3); }
    select option { background: var(--bg2); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    textarea { resize: none; min-height: 68px; line-height: 1.5; }

    .img-zone { width: 100%; aspect-ratio: 16/9; max-height: 160px; background: var(--bg3); border: 1px dashed var(--border2); border-radius: var(--r); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; overflow: hidden; position: relative; }
    .img-zone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .img-zone .iz-icon { stroke: var(--text3); fill: none; stroke-width: 1.5; width: 22px; height: 22px; }
    .img-zone .iz-label { font-size: 12px; color: var(--text3); }
    .img-clear { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.65); color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; font-size: 13px; cursor: pointer; align-items: center; justify-content: center; display: none; z-index: 2; }
    .has-img .img-clear { display: flex; }
    .has-img .iz-icon, .has-img .iz-label { display: none; }
    input[type=file] { display: none; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 18px; font-size: 14px; font-family: inherit; font-weight: 500; border-radius: var(--r); border: 1px solid var(--border2); background: transparent; color: var(--text); cursor: pointer; transition: all .15s; }
    .btn:hover { background: var(--bg3); }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 700; }
    .btn.primary:hover { background: var(--accent2); }
    .btn.full { width: 100%; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }

    .filter-bar { padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; position: sticky; top: 57px; z-index: 40; background: var(--bg); border-bottom: 1px solid var(--border); }
    .filter-bar input { flex: 1; min-width: 100px; font-size: 13px; padding: 7px 10px; }
    .filter-bar select { font-size: 13px; padding: 7px 8px; }

    .card-list { padding: 10px 16px; display: flex; flex-direction: column; gap: 9px; }
    .item-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); overflow: hidden; display: flex; animation: fadeUp .2s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none} }
    .item-thumb { width: 84px; flex-shrink: 0; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--text3); overflow: hidden; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item-body { flex: 1; padding: 10px 11px; min-width: 0; }
    .item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .item-price { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 3px; }
    .item-date { font-size: 10px; color: var(--text3); margin-bottom: 5px; }
    .item-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .badge { font-size: 10px; padding: 2px 7px; border-radius: 100px; background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
    .b-need  { background: rgba(224,92,92,.12);   color: #e05c5c;          border-color: rgba(224,92,92,.3); }
    .b-love  { background: rgba(232,184,109,.15); color: var(--accent);    border-color: rgba(232,184,109,.4); }
    .b-like  { background: rgba(91,155,213,.12);  color: var(--info);      border-color: rgba(91,155,213,.3); }
    .b-want  { background: var(--bg3);            color: var(--text3);     border-color: var(--border2); }
    .b-got   { background: rgba(92,168,122,.12);  color: var(--success);   border-color: rgba(92,168,122,.3); }
    .b-high  { background: rgba(224,92,92,.12);   color: #e05c5c;          border-color: rgba(224,92,92,.25); }
    .b-med   { background: rgba(232,184,109,.12); color: var(--accent);    border-color: rgba(232,184,109,.25); }
    .b-low   { background: var(--bg3); color: var(--text3); }
    .item-note { font-size: 11px; color: var(--text3); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
    .item-actions { display: flex; gap: 5px; align-items: center; }
    .item-actions a { font-size: 11px; color: var(--info); text-decoration: none; }
    .ia-btn { font-size: 11px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text3); cursor: pointer; font-family: inherit; transition: all .12s; }
    .ia-btn:hover { background: var(--bg3); color: var(--text); }
    .ia-btn.del { color: var(--danger); border-color: transparent; }
    .ia-btn.del:hover { background: rgba(224,92,92,.1); }

    .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 13px; }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }

    .upload-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 200; }
    .upload-overlay .sp { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
    .upload-overlay p { font-size: 14px; color: var(--text2); }

    #toast { position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--bg3); color: var(--text); font-size: 13px; padding: 9px 16px; border-radius: 100px; border: 1px solid var(--border2); opacity: 0; transition: all .22s; pointer-events: none; white-space: nowrap; z-index: 999; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 1000; }
    #loading .logo { font-size: 30px; font-weight: 700; color: var(--accent); }
    #loading .sp { width: 22px; height: 22px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }

    #lock-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; padding: 32px; }
    .lock-logo { font-size: 36px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .lock-sub { font-size: 13px; color: var(--text3); margin-bottom: 32px; }
    .lock-box { width: 100%; max-width: 320px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 24px; }
    .lock-lbl { font-size: 12px; color: var(--text3); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .08em; }
    .lock-inp { width: 100%; background: var(--bg3); color: var(--text); border: 1px solid var(--border2); border-radius: var(--r); padding: 12px 14px; font-size: 18px; font-family: inherit; outline: none; letter-spacing: .15em; text-align: center; transition: border-color .15s; margin-bottom: 12px; }
    .lock-inp:focus { border-color: var(--accent); }
    .lock-btn-go { width: 100%; padding: 12px; background: var(--accent); color: #0f0f0f; border: none; border-radius: var(--r); font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all .15s; }
    .lock-btn-go:hover { background: var(--accent2); }
    .lock-err { font-size: 12px; color: var(--danger); text-align: center; margin-top: 10px; min-height: 18px; }
    .lock-shake { animation: shake .35s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
  </style>
</head>
<body>

<div id="lock-screen" style="display:none">
  <div class="lock-logo">收藏</div>
  <div class="lock-sub">請輸入密碼以繼續</div>
  <div class="lock-box">
    <div class="lock-lbl">密碼</div>
    <input class="lock-inp" id="lock-input" type="password" placeholder="••••••••" maxlength="20"
      onkeydown="if(event.key==='Enter')checkPassword()" />
    <button class="lock-btn-go" onclick="checkPassword()">進入</button>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<div id="loading"><div class="logo">收藏</div><div class="sp"></div></div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-title">商品<em>收藏</em></div>
    <div class="sync-pill" onclick="loadItems()">
      <div class="dot busy" id="sync-dot"></div>
      <span id="sync-label">載入中</span>
    </div>
  </div>

  <div class="stats">
    <div class="stats-row">
      <div class="stat"><div class="stat-v c-need" id="s-need">0</div><div class="stat-l">需要 Need</div></div>
      <div class="stat"><div class="stat-v c-love" id="s-love">0</div><div class="stat-l">熱愛 Love</div></div>
      <div class="stat"><div class="stat-v c-like" id="s-like">0</div><div class="stat-l">喜歡 Like</div></div>
      <div class="stat"><div class="stat-v c-want" id="s-want">0</div><div class="stat-l">想要 Want</div></div>
    </div>
    <div class="budget-row">
      <div class="budget-card">
        <div class="budget-label">投資在熱愛</div>
        <div class="budget-val" id="s-love-budget">$0</div>
      </div>
      <div class="budget-card">
        <div class="budget-label">喜歡＋想要（可省下）</div>
        <div class="budget-val" id="s-lw-budget" style="color:var(--text3)">$0</div>
      </div>
    </div>
    <div class="stats-hint">把 Like 和 Want 省下來，狠狠花在 Love 上</div>
  </div>

  <div id="page-add" class="page active">
    <div class="url-section">
      <div class="url-box">
        <div class="url-label">貼上商品網址，自動抓取資訊</div>
        <div class="url-row">
          <input id="inp-url" placeholder="https://..." oninput="onUrlInput()" />
          <button class="fetch-btn" id="fetch-btn" onclick="doFetch()" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            抓取
          </button>
        </div>
        <div class="fetch-status" id="fetch-status"></div>
        <div class="preview-card" id="preview-card">
          <img class="preview-thumb" id="preview-thumb" src="" alt="" />
          <div>
            <div class="preview-name" id="preview-name"></div>
            <div class="preview-price" id="preview-price"></div>
            <div class="preview-shop" id="preview-shop"></div>
            <div class="preview-hint">↓ 可在下方修改或補充</div>
          </div>
        </div>
      </div>
    </div>

    <div class="edit-bar" id="edit-bar"><span>✏️ 正在編輯：<strong id="edit-bar-name"></strong></span><button onclick="resetAll()">取消編輯</button></div>
    <div class="form-section" id="form-section" style="display:none">
      <div class="form-card">
        <div class="form-card-title">
          <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          商品資訊
        </div>
        <div class="field">
          <label class="field-label">商品名稱 <span class="auto-badge" id="ab-name" style="display:none">自動填入</span></label>
          <input id="f-name" placeholder="請輸入商品名稱" />
        </div>
        <div class="field row2">
          <div>
            <label class="field-label">價格（NT$）<span class="auto-badge" id="ab-price" style="display:none">自動填入</span></label>
            <input id="f-price" type="number" placeholder="0" />
          </div>
          <div>
            <label class="field-label">來源 / 店家 <span class="auto-badge" id="ab-shop" style="display:none">自動填入</span></label>
            <input id="f-shop" placeholder="蝦皮、momo…" />
          </div>
        </div>
        <div class="field row2">
          <div>
            <label class="field-label">分類</label>
            <select id="f-status">
              <option value="需要">需要 Need：健康與安全生活所需</option>
              <option value="熱愛">熱愛 Love：真心喜愛，值得狠狠花</option>
              <option value="喜歡" selected>喜歡 Like：快樂約半年</option>
              <option value="想要">想要 Want：一時滿足</option>
              <option value="已得到">已得到</option>
            </select>
          </div>
          <div>
            <label class="field-label">優先度</label>
            <select id="f-priority">
              <option value="high">高優先</option>
              <option value="med">中優先</option>
              <option value="low">低優先</option>
            </select>
          </div>
        </div>

<script>
const API         = 'https://script.google.com/macros/s/AKfycbyZOHyGcoeM1MqKnUZEQjnsQqLlh1m7al7JzEbhBL94jCpOgSHoTX4uKJO9Z6I4am6F/exec';
const SESSION_KEY = 'wl_key';

let items     = [];
let imgLocal  = null;
let imgRemote = null;
let editingId = null;

const pRank  = { high:0, med:1, low:2 };
const pLabel = { high:'高優先', med:'中優先', low:'低優先' };
/* Need/Love/Like/Want 分類（《聰明生活經濟學》四問）＋ 已得到 */
const statusClass = { '需要':'b-need', '熱愛':'b-love', '喜歡':'b-like', '想要':'b-want', '已得到':'b-got' };
const STATUS_CYCLE = ['需要','熱愛','喜歡','想要','已得到'];
/* 舊資料相容：必要→需要；熱愛/喜歡不自動猜，由人重新分類 */
function normalizeStatus(st) { return st === '必要' ? '需要' : (statusClass[st] ? st : '想要'); }

/* 【修正】XSS 防護：商品名/備註/標籤來自外部網頁抓取，不可信任 */
function esc(str) {
  return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(u) {
  try { const p = new URL(String(u||''), location.href); return (p.protocol==='http:'||p.protocol==='https:') ? p.href : ''; }
  catch(e) { return ''; }
}

// ── 金鑰驗證（後端比對，前端不再硬編碼密碼）─────────────────
async function checkPassword() {
  const inp = document.getElementById('lock-input');
  const val = inp.value.trim();
  if (!val) return;
  document.getElementById('lock-err').textContent = '驗證中…';
  try {
    const res = await apiPost({ action:'verifyKey', key: val });
    if (res.ok) {
      sessionStorage.setItem(SESSION_KEY, val);
      document.getElementById('lock-screen').style.display = 'none';
      startApp();
      return;
    }
    document.getElementById('lock-err').textContent = res.locked ? '嘗試次數過多，請 10 分鐘後再試' : '密碼錯誤，請再試一次';
  } catch(e) {
    document.getElementById('lock-err').textContent = '連線失敗，請稍後再試';
  }
  inp.value = '';
  inp.classList.remove('lock-shake');
  void inp.offsetWidth;
  inp.classList.add('lock-shake');
  inp.focus();
}

async function startApp() {
  document.getElementById('app').style.display = '';
  await loadItems();
  /* manifest shortcuts：?page=list 直達清單 */
  try { const p = new URLSearchParams(location.search).get('page'); if (p==='list') showPage('list'); } catch(e) {}
}

// ── API ──────────────────────────────────────────────────────
// 【修正】全部改走 POST（text/plain 為 simple request，不觸發 CORS preflight）。
// 原版把寫入與 base64 圖片塞進 GET query string：洩漏內容且圖片必超 URL 上限。
async function apiPost(body) {
  const payload = Object.assign({ key: sessionStorage.getItem(SESSION_KEY) || '' }, body);
  const res = await fetch(API, { method:'POST', body: JSON.stringify(payload) });
  const data = await res.json();
  if (data && data.error === 'UNAUTHORIZED') {
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById('lock-screen').style.display = 'flex';
    throw new Error(data.locked ? '金鑰已鎖定，請稍後再試' : '金鑰失效，請重新登入');
  }
  return data;
}
const api = apiPost; /* 舊呼叫點相容 */

// ── 載入 ─────────────────────────────────────────────────────
async function loadItems() {
  setSyncState('busy', '同步中');
  try {
    const data = await api({ action:'list' });
    if (data.error) throw new Error(data.error);
    items = (data.items || []).reverse();
    items.forEach(i => { i.status = normalizeStatus(i.status); });
    updateStats();
    if (document.getElementById('page-list').classList.contains('active')) renderList();
    setSyncState('ok', '已同步');
  } catch(e) {
    setSyncState('err', '同步失敗');
    toast('載入失敗：' + e.message);
  }
}

// ── 抓取 ─────────────────────────────────────────────────────
function onUrlInput() {
  document.getElementById('fetch-btn').disabled = !document.getElementById('inp-url').value.trim().startsWith('http');
}

async function doFetch() {
  const url = document.getElementById('inp-url').value.trim();
  if (!url) return;
  setFetchState('loading', '正在抓取商品資訊…');
  document.getElementById('fetch-btn').disabled = true;
  document.getElementById('preview-card').classList.remove('show');
  try {
    const data = await api({ action:'fetch', url });
    if (data.error) throw new Error(data.error);
    if (!data.success) throw new Error('無法解析此頁面');
    applyFetched(data);
    setFetchState('success', `已抓取「${data.name.slice(0,22)}${data.name.length>22?'…':''}」`);
  } catch(e) {
    setFetchState('fail', `抓取失敗（${e.message}）— 請手動填寫`);
    showFormManual();
    const host = extractHost(url);
    if (host) { document.getElementById('f-shop').value = host; }
  }
  document.getElementById('fetch-btn').disabled = false;
}

function applyFetched(d) {
  if (d.name)  { document.getElementById('f-name').value  = d.name;  ab('name', true); }
  if (d.price) { document.getElementById('f-price').value = d.price; ab('price', true); }
  const shop = d.source || d.shop || '';
  if (shop) { document.getElementById('f-shop').value = shop; ab('shop', true); }
  imgRemote = safeUrl(d.imgUrl) || null;
  if (imgRemote) { setImgZone(imgRemote); ab('img', true); }
  document.getElementById('preview-name').textContent  = d.name;
  document.getElementById('preview-price').textContent = d.price ? 'NT$ ' + d.price.toLocaleString() : '';
  document.getElementById('preview-shop').textContent  = shop;
  const thumb = document.getElementById('preview-thumb');
  const pv = safeUrl(d.imgUrl);
  thumb.src = pv; thumb.style.display = pv ? '' : 'none';
  document.getElementById('preview-card').classList.add('show');
  document.getElementById('form-section').style.display = '';
}

function showFormManual() {
  document.getElementById('form-section').style.display = '';
  ['name','price','shop','img'].forEach(k => ab(k, false));
  setTimeout(() => document.getElementById('form-section').scrollIntoView({ behavior:'smooth' }), 50);
}

function setFetchState(type, msg) {
  const el = document.getElementById('fetch-status');
  el.className = 'fetch-status ' + type;
  el.innerHTML = type === 'loading' ? `<div class="sp-sm"></div><span>${msg}</span>` : `<span>${type==='success'?'✓':'✗'} ${msg}</span>`;
}

function ab(field, show) {
  const el = document.getElementById('ab-' + field);
  if (el) el.style.display = show ? '' : 'none';
}

function extractHost(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch(e) { return ''; }
}

// ── 圖片 ─────────────────────────────────────────────────────
function triggerImg() { document.getElementById('file-inp').click(); }

function handleImg(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const tmp = new Image();
    tmp.onload = () => {
      const MAX = 800, c = document.createElement('canvas');
      let w = tmp.width, h = tmp.height;
      if (w > MAX || h > MAX) { if (w > h) { h = Math.round(h*MAX/w); w = MAX; } else { w = Math.round(w*MAX/h); h = MAX; } }
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(tmp, 0, 0, w, h);
      imgLocal = c.toDataURL('image/jpeg', 0.75); imgRemote = null;
      setImgZone(imgLocal); ab('img', false);
    };
    tmp.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function setImgZone(src) {
  const z = document.getElementById('img-zone');
  let img = z.querySelector('img.zi');
  if (!img) { img = document.createElement('img'); img.className='zi'; img.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;'; z.prepend(img); }
  img.src = src; z.classList.add('has-img');
}

function clearImg(e) {
  if (e) e.stopPropagation();
  imgLocal = null; imgRemote = null;
  document.getElementById('file-inp').value = '';
  const z = document.getElementById('img-zone');
  const img = z.querySelector('img.zi'); if (img) img.remove();
  z.classList.remove('has-img'); ab('img', false);
}

// ── 【新增】香水擴充欄位 ─────────────────────────────────────
// 多值欄位（逗號分隔）與單值欄位分開列表，蒐集/填入時分別處理，
// 跟主表 tags 欄位是同一種「陣列轉逗號字串存單格」慣例。
const PERFUME_MULTI_FIELDS = ['notes_top','notes_heart','notes_base','family','occasion','season','daypart'];
const PERFUME_FIELD_MAP = {
  brand:'p-brand', name_en:'p-name-en', edition:'p-edition', year:'p-year',
  size_ml:'p-size-ml', concentration:'p-concentration',
  notes_top:'p-notes-top', notes_heart:'p-notes-heart', notes_base:'p-notes-base', family:'p-family',
  perf_longevity:'p-longevity', perf_sillage:'p-sillage', perf_sweetness:'p-sweetness',
  perf_freshness:'p-freshness', perf_woody:'p-woody',
  occasion:'p-occasion', season:'p-season', daypart:'p-daypart',
  purchase_price:'p-purchase-price', purchase_date:'p-purchase-date',
  rating:'p-rating', longevity_personal:'p-longevity-personal', occasion_fit:'p-occasion-fit',
  notes_personal:'p-notes-personal', review:'p-review',
  item_status:'p-item-status', source_type:'p-source-type', source_raw:'p-source-raw',
};

function togglePerfumeFields() {
  const isPerfume = document.getElementById('f-category').value === '香水';
  document.getElementById('perfume-fields').style.display = isPerfume ? '' : 'none';
}

function collectPerfumeAttrs() {
  const attrs = {};
  Object.keys(PERFUME_FIELD_MAP).forEach(key => {
    const el = document.getElementById(PERFUME_FIELD_MAP[key]);
    if (!el) { attrs[key] = PERFUME_MULTI_FIELDS.includes(key) ? [] : ''; return; }
    const raw = el.value.trim();
    attrs[key] = PERFUME_MULTI_FIELDS.includes(key)
      ? raw.split(',').map(s => s.trim()).filter(Boolean)
      : raw;
  });
  return attrs;
}

function fillPerfumeAttrs(attrs) {
  attrs = attrs || {};
  Object.keys(PERFUME_FIELD_MAP).forEach(key => {
    const el = document.getElementById(PERFUME_FIELD_MAP[key]);
    if (!el) return;
    const v = attrs[key];
    el.value = PERFUME_MULTI_FIELDS.includes(key) ? (Array.isArray(v) ? v.join(', ') : (v||'')) : (v==null?'':v);
  });
  // 狀態/來源有預設值，讀不到資料時保留下拉的預設選項，不強制清空
  if (!attrs.item_status)  document.getElementById('p-item-status').value  = '已擁有';
  if (!attrs.source_type)  document.getElementById('p-source-type').value  = '手動';
}

function clearPerfumeFields() {
  Object.values(PERFUME_FIELD_MAP).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('p-item-status').value = '已擁有';
  document.getElementById('p-source-type').value = '手動';
}

// ── 儲存 ─────────────────────────────────────────────────────
async function saveItem() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('請填入商品名稱'); return; }
  const btn = document.getElementById('save-btn');
  btn.textContent = '儲存中…'; btn.disabled = true;
  try {
    let finalImgUrl = imgRemote || null;
    if (imgLocal) {
      showUploadOverlay('上傳圖片到 Google Drive…');
      const up = await apiPost({ action:'uploadImg', base64: imgLocal, filename:`img_${Date.now()}.jpg` });
      hideUploadOverlay();
      if (up.error) throw new Error('圖片上傳失敗：' + up.error);
      finalImgUrl = up.imgUrl;
    }
    const category = document.getElementById('f-category').value;
    const item = {
      name, url: document.getElementById('inp-url').value.trim(),
      price: parseFloat(document.getElementById('f-price').value) || 0,
      shop: document.getElementById('f-shop').value.trim(),
      status: document.getElementById('f-status').value,
      priority: document.getElementById('f-priority').value,
      tags: document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
      note: document.getElementById('f-note').value.trim(),
      imgUrl: finalImgUrl,
      category,
    };
    // 【新增】類型為香水時一併送出明細，後端會在同一次執行內寫入兩張表
    if (category === '香水') item.attrs = collectPerfumeAttrs();
    const res = editingId
      ? await apiPost({ action:'update', id: editingId, item })
      : await apiPost({ action:'save', item });
    if (res.error) throw new Error(res.error);
    toast(editingId ? '已更新！' : '儲存成功！');
    resetAll();
    await loadItems();
  } catch(e) {
    hideUploadOverlay();
    toast('失敗：' + e.message);
  }
  btn.textContent = editingId ? '更新商品' : '儲存商品';
  btn.disabled = false;
}

// ── 刪除 ─────────────────────────────────────────────────────
async function deleteItem(id) {
  if (!confirm('確定要刪除這件商品？')) return;
  setSyncState('busy', '刪除中');
  try {
    const res = await apiPost({ action:'delete', id: String(id) });
    if (res.error) throw new Error(res.error);
    items = items.filter(i => String(i.id) !== String(id));
    updateStats(); renderList();
    setSyncState('ok', '已同步'); toast('已刪除');
  } catch(e) {
    setSyncState('err', '失敗'); toast('刪除失敗：' + e.message);
  }
}

// ── 切換分類 ─────────────────────────────────────────────────
async function toggleStatus(id) {
  const item = items.find(i => String(i.id) === String(id)); if (!item) return;
  const next = STATUS_CYCLE[(STATUS_CYCLE.indexOf(item.status) + 1) % STATUS_CYCLE.length];
  try {
    await apiPost({ action:'update', id: String(id), item: { ...item, status: next, tags: item.tags || [] } });
    item.status = next; updateStats(); renderList();
  } catch(e) { toast('更新失敗'); }
}

// ── 編輯 ─────────────────────────────────────────────────────
function editItem(id) {
  const item = items.find(i => String(i.id) === String(id)); if (!item) return;
  editingId = String(id);
  document.getElementById('inp-url').value    = item.url || '';
  document.getElementById('f-name').value     = item.name || '';
  document.getElementById('f-price').value    = item.price || '';
  document.getElementById('f-shop').value     = item.shop || '';
  document.getElementById('f-status').value   = item.status || '需要';
  document.getElementById('f-priority').value = item.priority || 'high';
  document.getElementById('f-tags').value     = (item.tags||[]).join(', ');
  document.getElementById('f-note').value     = item.note || '';
  document.getElementById('f-category').value = item.category || '';
  togglePerfumeFields();
  if (item.category === '香水') fillPerfumeAttrs(item.attrs); else clearPerfumeFields();
  const eimg = safeUrl(item.imgUrl);
  if (eimg) { imgRemote = eimg; setImgZone(eimg); }
  /* 【修正】編輯狀態可視化：原本切走再填新品會靜默覆蓋舊商品 */
  document.getElementById('edit-bar').classList.add('show');
  document.getElementById('edit-bar-name').textContent = item.name || '';
  document.getElementById('form-section').style.display = '';
  document.getElementById('save-btn').textContent = '更新商品';
  showPage('add');
  window.scrollTo({ top:0, behavior:'smooth' });
}

// ── Reset ─────────────────────────────────────────────────────
function resetAll() {
  document.getElementById('inp-url').value = '';
  document.getElementById('fetch-status').className = 'fetch-status';
  document.getElementById('fetch-status').innerHTML = '';
  document.getElementById('preview-card').classList.remove('show');
  document.getElementById('form-section').style.display = 'none';
  document.getElementById('fetch-btn').disabled = true;
  ['f-name','f-price','f-shop','f-tags','f-note'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-status').value   = '喜歡';
  document.getElementById('f-priority').value = 'high';
  document.getElementById('f-category').value = '';
  clearPerfumeFields(); togglePerfumeFields();
  clearImg(); editingId = null;
  document.getElementById('edit-bar').classList.remove('show');
  document.getElementById('save-btn').textContent = '儲存商品';
  ['name','price','shop','img'].forEach(k => ab(k, false));
}

// ── 【新增】香水卡片摘要（濃度＋香調家族，資料已由 actionList 一併 join）──
function renderPerfumeSummary(attrs) {
  const parts = [];
  if (attrs.concentration) parts.push(esc(attrs.concentration));
  if (attrs.family && attrs.family.length) parts.push(esc(attrs.family.join('、')));
  if (attrs.rating) parts.push('★'.repeat(Number(attrs.rating)||0));
  if (!parts.length) return '';
  return `<div class="item-note" style="color:var(--accent)">${parts.join(' · ')}</div>`;
}

// ── Render ────────────────────────────────────────────────────
function renderList() {
  const q    = (document.getElementById('q')?.value||'').toLowerCase();
  const fst  = document.getElementById('f-st')?.value||'';
  const sort = document.getElementById('f-sort')?.value||'newest';

  let list = items.filter(i => {
    if (fst && i.status !== fst) return false;
    if (q) { const h=[i.name,i.shop,i.note,...(i.tags||[])].join(' ').toLowerCase(); if(!h.includes(q)) return false; }
    return true;
  });

  if (sort==='price-asc')  list.sort((a,b) => a.price - b.price);
  else if (sort==='price-desc') list.sort((a,b) => b.price - a.price);
  else if (sort==='priority')   list.sort((a,b) => (pRank[a.priority]||0) - (pRank[b.priority]||0));
  else if (sort==='oldest')     list.sort((a,b) => new Date(a.createdAt||0) - new Date(b.createdAt||0));

  const el = document.getElementById('card-list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🛒</div><div>${q||fst?'沒有符合的商品':'還沒有收藏，從新增開始吧'}</div></div>`;
    return;
  }

  el.innerHTML = list.map((item, idx) => {
    const dateStr = item.createdAt ? new Date(item.createdAt).toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}) : '';
    const sc = statusClass[item.status] || '';
    const pc = item.priority === 'high' ? 'b-high' : item.priority === 'med' ? 'b-med' : 'b-low';
    const idStr = String(item.id);
    /* 【修正】商品名/備註/標籤來自外部網頁抓取，全面跳脫；網址限 http/https */
    const imgSrc = safeUrl(item.imgUrl);
    const linkUrl = safeUrl(item.url);
    return `<div class="item-card" style="animation-delay:${idx*.04}s">
      <div class="item-thumb">${imgSrc?`<img src="${esc(imgSrc)}" alt="" loading="lazy">`:(item.shop?esc(String(item.shop).charAt(0)):'🛍')}</div>
      <div class="item-body">
        <div class="item-name" title="${esc(item.name)}">${esc(item.name)}</div>
        ${item.price?`<div class="item-price">NT$ ${Number(item.price).toLocaleString()}</div>`:''}
        ${dateStr?`<div class="item-date">加入於 ${dateStr}</div>`:''}
        <div class="item-badges">
          <span class="badge ${sc}">${esc(item.status)}</span>
          <span class="badge ${pc}">${esc(pLabel[item.priority]||item.priority)}</span>
          ${item.category?`<span class="badge">${esc(item.category)}</span>`:''}
          ${(item.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}
        </div>
        ${item.category==='香水' && item.attrs ? renderPerfumeSummary(item.attrs) : ''}
        ${item.note?`<div class="item-note">${esc(item.note)}</div>`:''}
        <div class="item-actions">
          ${linkUrl?`<a href="${esc(linkUrl)}" target="_blank" rel="noopener">🔗</a>`:''}
          <button class="ia-btn" style="margin-left:auto" onclick="toggleStatus('${idStr}')">切換</button>
          <button class="ia-btn" onclick="editItem('${idStr}')">編輯</button>
          <button class="ia-btn del" onclick="deleteItem('${idStr}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Stats ─────────────────────────────────────────────────────
function updateStats() {
  const sum = list => list.filter(i=>i.price).reduce((s,i)=>s+Number(i.price),0);
  const need = items.filter(i => i.status==='需要');
  const love = items.filter(i => i.status==='熱愛');
  const like = items.filter(i => i.status==='喜歡');
  const want = items.filter(i => i.status==='想要');
  document.getElementById('s-need').textContent = need.length;
  document.getElementById('s-love').textContent = love.length;
  document.getElementById('s-like').textContent = like.length;
  document.getElementById('s-want').textContent = want.length;
  /* 框架核心對比：該狠狠花的 vs 該省下來的 */
  document.getElementById('s-love-budget').textContent = '$' + sum(love).toLocaleString();
  document.getElementById('s-lw-budget').textContent   = '$' + sum([...like,...want]).toLocaleString();
}

function showPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if (p==='list') renderList();
}

function setSyncState(s, l) {
  document.getElementById('sync-dot').className = 'dot '+s;
  document.getElementById('sync-label').textContent = l;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2400);
}

function showUploadOverlay(msg) {
  let ov = document.getElementById('upload-ov');
  if (!ov) { ov=document.createElement('div'); ov.id='upload-ov'; ov.className='upload-overlay'; document.body.appendChild(ov); }
  ov.innerHTML=`<div class="sp"></div><p>${msg}</p>`; ov.style.display='flex';
}
function hideUploadOverlay() {
  const ov = document.getElementById('upload-ov'); if(ov) ov.style.display='none';
}

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('load', () => {
  document.getElementById('loading').style.display = 'none';
  if (sessionStorage.getItem(SESSION_KEY)) {
    startApp();
  } else {
    document.getElementById('lock-screen').style.display = 'flex';
    setTimeout(() => document.getElementById('lock-input').focus(), 100);
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
